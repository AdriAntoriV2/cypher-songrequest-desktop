[package]
name = "CypherSR-Desktop"
version = "1.0.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
open = "5.4.4"
raw-window-handle = "0.6"
directories = "6"
toml = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", features = ["raw-window-handle-06"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
sha2 = "0.10"

[build-dependencies]
slint-build = "1"
winresource = "0.1"