[package]
name = "cypher-songrequest-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
open = "5.4.4"
raw-window-handle = "0.6"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", features = ["raw-window-handle-06"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"